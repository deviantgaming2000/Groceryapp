services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grocery_price_checker}
      POSTGRES_USER: ${POSTGRES_USER:-grocery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grocery_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-grocery}:${POSTGRES_PASSWORD:-grocery_change_me}@postgres:5432/${POSTGRES_DB:-grocery_price_checker}?schema=public
      SINGLE_USER_EMAIL: ${SINGLE_USER_EMAIL:-local@example.com}
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run seed"

  # Self-hosted Walmart scraper. Built from the sibling repo (default ../walmart-scraper,
  # overridable via WALMART_SCRAPER_CONTEXT). Optional: the app boots and manual price
  # entry works without it; the backend simply reports the Walmart scraper as unreachable.
  walmart-scraper:
    build:
      context: ${WALMART_SCRAPER_CONTEXT:-../walmart-scraper}
    restart: unless-stopped
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-grocery}:${POSTGRES_PASSWORD:-grocery_change_me}@postgres:5432/${POSTGRES_DB:-grocery_price_checker}?schema=public
      SINGLE_USER_EMAIL: ${SINGLE_USER_EMAIL:-local@example.com}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # Reach the scraper by its compose service name on the shared default network.
      WALMART_SCRAPER_URL: ${WALMART_SCRAPER_URL:-http://walmart-scraper:8090}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      walmart-scraper:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
